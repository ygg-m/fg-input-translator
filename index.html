<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fighting Game Input Translator</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <main>
      <h1>Fighting Game Input Translator</h1>
      <p class="intro"><strong>236P</strong> becomes a quarter-circle and a punch.</p>

      <div id="notices" role="status"></div>

      <label for="game">Game</label>
      <select id="game"></select>

      <section id="workspace"></section>
      <p id="status" role="status"></p>

      <h2>Saved definitions for this game</h2>
      <section id="saved"></section>
    </main>
  </body>
</html>
